<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Integrite Musiques/Fichiers</title>
    <link rel="stylesheet" href="musicIntegrity.css" />
  </head>
  <body>
    <main class="audit-page">
      <section class="panel">
        <div class="audit-head">
          <h1>Verification de coherence</h1>
          <button id="runAuditButton" class="audit-btn" type="button">Lancer la verification</button>
        </div>

        <p id="auditStatus" class="status">Pret.</p>

        <div class="audit-grid">
          <div class="audit-metric">
            <div class="audit-metric-label">Entrees en base</div>
            <div id="metricDbMusicCount" class="audit-metric-value">0</div>
          </div>
          <div class="audit-metric">
            <div class="audit-metric-label">Fichiers audio detectes</div>
            <div id="metricAudioFilesCount" class="audit-metric-value">0</div>
          </div>
          <div class="audit-metric">
            <div class="audit-metric-label">Musiques sans fichier</div>
            <div id="metricMissingFilesCount" class="audit-metric-value">0</div>
          </div>
          <div class="audit-metric">
            <div class="audit-metric-label">Fichiers sans musique</div>
            <div id="metricOrphanFilesCount" class="audit-metric-value">0</div>
          </div>
          <div class="audit-metric">
            <div class="audit-metric-label">Musiques avec doublons</div>
            <div id="metricMultipleFilesCount" class="audit-metric-value">0</div>
          </div>
        </div>

        <article class="audit-block">
          <h2>Musiques sans fichier correspondant</h2>
          <div id="missingFilesContainer"></div>
        </article>

        <article class="audit-block">
          <h2>Fichiers sans entree correspondante dans Musiques</h2>
          <div id="orphanFilesContainer"></div>
        </article>

        <article class="audit-block">
          <h2>Plusieurs fichiers pour une meme musique</h2>
          <div id="multipleFilesContainer"></div>
        </article>
      </section>
    </main>

    <script>
      const runAuditButton = document.getElementById('runAuditButton');
      const auditStatus = document.getElementById('auditStatus');

      const metricDbMusicCount = document.getElementById('metricDbMusicCount');
      const metricAudioFilesCount = document.getElementById('metricAudioFilesCount');
      const metricMissingFilesCount = document.getElementById('metricMissingFilesCount');
      const metricOrphanFilesCount = document.getElementById('metricOrphanFilesCount');
      const metricMultipleFilesCount = document.getElementById('metricMultipleFilesCount');

      const missingFilesContainer = document.getElementById('missingFilesContainer');
      const orphanFilesContainer = document.getElementById('orphanFilesContainer');
      const multipleFilesContainer = document.getElementById('multipleFilesContainer');

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;');
      }

      function setStatus(message, isError = false) {
        auditStatus.textContent = message;
        auditStatus.style.color = isError ? '#fca5a5' : '#7dd3fc';
      }

      function renderEmpty(container, label) {
        container.innerHTML = `<p class="audit-empty">${escapeHtml(label)}</p>`;
      }

      function createActionButtons(actions) {
        const buttons = actions.map((action) => {
          const actionName = escapeHtml(action.action || '');
          const label = escapeHtml(action.label || 'Action');
          const toneClass = action.tone === 'danger' ? 'audit-action-danger' : 'audit-action-primary';
          const musicId = escapeHtml(action.musicId || '');
          const filePath = escapeHtml(action.filePath || '');

          return `<button
            type="button"
            class="audit-action ${toneClass}"
            data-audit-action="${actionName}"
            data-music-id="${musicId}"
            data-file-path="${filePath}"
          >${label}</button>`;
        }).join('');

        return `<div class="audit-actions">${buttons}</div>`;
      }

      function renderMissingFiles(items) {
        if (!Array.isArray(items) || items.length === 0) {
          renderEmpty(missingFilesContainer, 'Aucune musique manquante.');
          return;
        }

        const rows = items.map((item) => `
          <tr>
            <td class="audit-code">${escapeHtml(item.Id || '')}</td>
            <td>${escapeHtml(item.Titre || '')}</td>
            <td>${escapeHtml(item.Artiste || '')}</td>
            <td>${escapeHtml(item.Album || '')}</td>
            <td>
              ${createActionButtons([
                {
                  action: 'add_music_file',
                  label: 'Ajouter fichier',
                  musicId: item.Id || '',
                  tone: 'primary',
                },
                {
                  action: 'delete_music_entry',
                  label: 'Supprimer entree',
                  musicId: item.Id || '',
                  tone: 'danger',
                },
              ])}
            </td>
          </tr>
        `).join('');

        missingFilesContainer.innerHTML = `
          <div class="audit-table-wrap">
            <table class="audit-table">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Titre</th>
                  <th>Artiste</th>
                  <th>Album</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      function renderOrphanFiles(items) {
        if (!Array.isArray(items) || items.length === 0) {
          renderEmpty(orphanFilesContainer, 'Aucun fichier orphelin.');
          return;
        }

        const rows = items.map((item) => `
          <tr>
            <td class="audit-code">${escapeHtml(item.id || '')}</td>
            <td>${escapeHtml(item.file || '')}</td>
            <td class="audit-code">${escapeHtml(item.path || '')}</td>
            <td>
              ${createActionButtons([
                {
                  action: 'add_music_entry',
                  label: 'Ajouter entree',
                  musicId: item.id || '',
                  filePath: item.path || '',
                  tone: 'primary',
                },
                {
                  action: 'delete_file',
                  label: 'Supprimer fichier',
                  filePath: item.path || '',
                  tone: 'danger',
                },
              ])}
            </td>
          </tr>
        `).join('');

        orphanFilesContainer.innerHTML = `
          <div class="audit-table-wrap">
            <table class="audit-table">
              <thead>
                <tr>
                  <th>Id detecte</th>
                  <th>Fichier</th>
                  <th>Chemin</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      function renderMultipleFiles(items) {
        if (!Array.isArray(items) || items.length === 0) {
          renderEmpty(multipleFilesContainer, 'Aucun doublon detecte.');
          return;
        }

        const rows = items.map((entry) => {
          const music = entry.music || {};
          const fileList = Array.isArray(entry.files)
            ? entry.files.map((fileEntry) => `<div class="audit-code">${escapeHtml(fileEntry.path || '')}</div>`).join('')
            : '';

          return `
            <tr>
              <td class="audit-code">${escapeHtml(music.Id || '')}</td>
              <td>${escapeHtml(music.Titre || '')}</td>
              <td>${escapeHtml(music.Artiste || '')}</td>
              <td>${fileList}</td>
            </tr>
          `;
        }).join('');

        multipleFilesContainer.innerHTML = `
          <div class="audit-table-wrap">
            <table class="audit-table">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Titre</th>
                  <th>Artiste</th>
                  <th>Fichiers</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      function applySummary(summary) {
        metricDbMusicCount.textContent = String(summary.dbMusicCount || 0);
        metricAudioFilesCount.textContent = String(summary.audioFilesCount || 0);
        metricMissingFilesCount.textContent = String(summary.missingFilesCount || 0);
        metricOrphanFilesCount.textContent = String(summary.orphanFilesCount || 0);
        metricMultipleFilesCount.textContent = String(summary.multipleFilesPerMusicCount || 0);
      }

      async function runIntegrityAction(action, musicId, filePath) {
        const body = new URLSearchParams({
          musicFilesIntegrityAction: '1',
          action: String(action || ''),
        });

        if (musicId) {
          body.set('musicId', String(musicId));
        }

        if (filePath) {
          body.set('filePath', String(filePath));
        }

        const response = await fetch('../../php/interface.php', {
          method: 'POST',
          credentials: 'same-origin',
          cache: 'no-store',
          body,
        });

        if (response.status === 401) {
          window.parent.postMessage({ type: 'USER_LOGGED_OUT' }, '*');
          return { redirected: true };
        }

        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.error || `Erreur API (${response.status})`);
        }

        return payload;
      }

      async function runAudit() {
        setStatus('Verification en cours...');
        runAuditButton.disabled = true;

        try {
          const response = await fetch('../../php/interface.php?musicFilesIntegrity=1', {
            credentials: 'same-origin',
            cache: 'no-store',
          });

          if (response.status === 401) {
            window.parent.postMessage({ type: 'USER_LOGGED_OUT' }, '*');
            return;
          }

          const payload = await response.json();

          if (!response.ok || !payload.success) {
            throw new Error(payload.error || `Erreur API (${response.status})`);
          }

          const report = payload.report || {};
          applySummary(report.summary || {});
          renderMissingFiles(report.missingFiles || []);
          renderOrphanFiles(report.orphanFiles || []);
          renderMultipleFiles(report.multipleFilesPerMusic || []);

          setStatus('Verification terminee.');
        } catch (error) {
          console.error(error);
          setStatus(String(error.message || 'Erreur inconnue.'), true);
        } finally {
          runAuditButton.disabled = false;
        }
      }

      runAuditButton.addEventListener('click', () => {
        void runAudit();
      });

      document.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) {
          return;
        }

        const action = String(target.dataset.auditAction || '').trim();
        if (!action) {
          return;
        }

        const musicId = String(target.dataset.musicId || '').trim();
        const filePath = String(target.dataset.filePath || '').trim();
        const isDeleteAction = action === 'delete_music_entry' || action === 'delete_file';
        if (isDeleteAction && !window.confirm('Confirmer cette suppression ?')) {
          return;
        }

        const allActionButtons = Array.from(document.querySelectorAll('[data-audit-action]'));
        allActionButtons.forEach((button) => {
          button.disabled = true;
        });

        void (async () => {
          try {
            setStatus('Application de la correction...');
            const payload = await runIntegrityAction(action, musicId, filePath);
            if (payload && payload.redirected) {
              return;
            }

            setStatus('Correction appliquee. Reverification...');
            await runAudit();
          } catch (error) {
            console.error(error);
            setStatus(String(error.message || 'Erreur lors de la correction.'), true);
          } finally {
            allActionButtons.forEach((button) => {
              button.disabled = false;
            });
          }
        })();
      });

      void runAudit();
    </script>
  </body>
</html>
