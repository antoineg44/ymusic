<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YMusic</title>
    <!--<base href="/" />-->

    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="components/colors/colors.css" />
  </head>
  <body>
    <div id="includes_html"></div>
    
    <app-root></app-root>
 
    <script src="js/musique_suivante.js"></script>
    <script src="js/lecteur.js"></script>
    <script src="js/recherche.js"></script>
    <script src="components/auth/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/config.js"></script>
    <script src="components/interface/db_interface.js"></script>
    <script>
      if(webapp())
      {
        // application web
        console.log("Domaine autorisé");
        
        // Ajout de includes.html avec l'interface web
        fetch("includes.html")
        .then(response => response.text())
        .then(html => {
          document.getElementById("includes_html").innerHTML = html;
          // Initialiser l'app après que le HTML soit inséré
          void initializeApp();
        });

      } else {
        // Application smartphone
        console.log("Domaine non autorisé");
      }
    </script>
  </body>
</html>
