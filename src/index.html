<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="components/colors/colors.css" />
  </head>
  <body>
    <div class="app">
      <div class="app-shell" id="webapp">

      </div>
    </div>

    <script src="js/musique_suivante.js"></script>
    <script src="js/lecteur.js"></script>
    <script src="js/recherche.js"></script>
    <script src="components/auth/auth.js"></script>
    <script src="app.js"></script>
    <script>
      const domain_approv = [
        "localhost",
        "192.168.1.10",
        "music.partitions.ovh"
      ];
      if (domain_approv.includes(window.location.host)) {
        // application web
        console.log("Domaine autorisé");
        
        // Ajout de includes.html avec l'interface web
        fetch("includes.html")
        .then(response => response.text())
        .then(html => {
          document.getElementById("webapp").innerHTML = html;
          // Initialiser l'app après que le HTML soit inséré
          void initializeApp();
        });

      } else {
        // Application smartphone
        console.log("Domaine non autorisé");
      }
    </script>
  </body>
</html>
