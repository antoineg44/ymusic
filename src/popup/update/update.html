<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mise à jour</title>
    <style>
      :root{color-scheme:light dark}
      body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#e2e8f0;background:transparent}
      .box{max-width:420px;background:#1e293b;padding:24px;border-radius:12px;margin:24px auto;color:#e2e8f0;text-align:center}
      .icon{font-size:2.5rem;margin-bottom:8px}
      h1{margin:0 0 8px;font-size:1.25rem}
      p{margin:0 0 20px;color:#cbd5e1}
      .actions a{display:inline-block;background:#38bdf8;color:#0f172a;border-radius:10px;padding:10px 24px;font-weight:600;text-decoration:none;margin-right:8px}
      .actions button{background:transparent;border:1px solid rgba(148,163,184,0.5);color:#cbd5e1;border-radius:10px;padding:10px 24px;font-weight:600;cursor:pointer}
    </style>
  </head>
  <body>
    <div class="box" role="dialog" aria-modal="true" aria-label="Mise à jour disponible">
      <div class="icon">⬆️</div>
      <h1>Nouvelle version disponible</h1>
      <p id="text">La nouvelle version est disponible.</p>
      <div class="actions">
        <a id="downloadLink" href="#" target="_blank" rel="noopener" download>Telecharger</a>
        <button id="laterButton" type="button">Plus tard</button>
      </div>
    </div>

    <script>
      function params() {
        try { return Object.fromEntries(new URLSearchParams(location.search)); } catch (e) { return {}; }
      }

      const p = params();
      const version = p.version || '';
      const url = p.url || '';
      const text = document.getElementById('text');
      const downloadLink = document.getElementById('downloadLink');
      const laterButton = document.getElementById('laterButton');

      if (version) {
        text.textContent = `La version ${version} de l'application est disponible au téléchargement.`;
      }

      if (url) {
        downloadLink.href = url;
      } else {
        downloadLink.href = '#';
        downloadLink.style.opacity = '0.6';
        downloadLink.style.pointerEvents = 'none';
      }

      downloadLink.addEventListener('click', (e) => {
        // Ask parent to close the modal after initiating download
        try {
          window.parent.postMessage({ source: 'update', type: 'DOWNLOAD', url }, '*');
        } catch (err) {
          // ignore
        }
      });

      laterButton.addEventListener('click', () => {
        try { window.parent.postMessage({ source: 'update', type: 'CLOSE_UPDATE' }, '*'); } catch (e) {}
      });
    </script>
  </body>
</html>
