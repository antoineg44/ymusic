<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Artistes - YMusic</title>
		<link rel="stylesheet" href="../../styles.css" />
    	<link rel="stylesheet" href="../../components/listMusic/listMusic.css" />
    	<link rel="stylesheet" href="artist.css" />
    	<script src="../../js/config.js"></script>
	</head>
	<body>
		<main class="artists-page">
			<section class="panel">
				<div class="artists-head">
					<div>
						<h1>Artistes en base</h1>
						<p id="artistsStatus" class="status">Chargement...</p>
					</div>
				</div>

				<div class="artists-table-wrap">
					<table class="artists-table" aria-label="Liste des artistes">
						<thead>
							<tr>
								<th>Artiste</th>
								<th>Nombre de musiques</th>
							</tr>
						</thead>
						<tbody id="artistsBody"></tbody>
					</table>
				</div>

				<div id="artistSongsPanel" class="artist-songs-panel is-hidden">
					<div class="artists-head">
						<div>
							<h2 id="songsTitle">Musiques</h2>
							<p id="songsStatus" class="status"></p>
						</div>
						<div class="artists-actions">
							<button id="playAllSongsBtn" class="play-all-btn" type="button">Lire tout</button>
							<button id="backToArtistsBtn" class="artists-back" type="button">Retour aux artistes</button>
						</div>
					</div>
					<div class="artists-table-wrap">
						<ul id="songsList" class="artist-songs-list" aria-label="Musiques de l'artiste"></ul>
					</div>
					<audio id="artistPreviewAudio" preload="none" style="width: 100%; margin-top: 14px;"></audio>
				</div>
			</section>
		</main>

		<script src="../../components/listMusic/listMusic.js"></script>
    	<script src="artist.js"></script>
	</body>
</html>
