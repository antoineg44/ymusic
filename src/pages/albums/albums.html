<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Mes favoris - YMusic</title>
		<link rel="stylesheet" href="../../components/colors/styles.css" />
    	<script src="../../js/config.js"></script>
		<style>
			.liked-page {
				max-width: 1100px;
				margin: 0 auto;
				padding: 24px;
			}

			.liked-head {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
				margin-bottom: 16px;
			}

			.liked-table-wrap {
				overflow-x: auto;
			}

			.liked-table {
				width: 100%;
				border-collapse: collapse;
			}

			.liked-table th,
			.liked-table td {
				text-align: left;
				border-bottom: 1px solid rgba(148, 163, 184, 0.2);
				padding: 10px;
			}

			.liked-table tbody tr {
				cursor: pointer;
			}

			.liked-table tbody tr:hover {
				background: rgba(148, 163, 184, 0.12);
			}

			.play-btn {
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main class="liked-page">
			<section class="panel">
				<div class="liked-head">
					<div>
						<h1>Mes musiques aimées</h1>
						<p id="likedStatus" class="status">Chargement...</p>
					</div>
				</div>

				<div class="liked-table-wrap">
					<table class="liked-table" aria-label="Liste des musiques aimées">
						<thead>
							<tr>
								<th>Titre</th>
								<th>Artiste</th>
								<th>Album</th>
								<th>Vues</th>
								<th></th>
							</tr>
						</thead>
						<tbody id="likedBody"></tbody>
					</table>
				</div>
			</section>
		</main>

		<script>
			const likedBody = document.getElementById('likedBody');
			const likedStatus = document.getElementById('likedStatus');

			function escapeHtml(value) {
				return String(value ?? '')
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/\"/g, '&quot;');
			}

			function setStatus(message, isError = false) {
				likedStatus.textContent = message;
				likedStatus.style.color = isError ? '#fca5a5' : '#7dd3fc';
			}

			function playMusic(row) {
				const id = String((row && row.Id) || '').trim();
				if (!id) {
					setStatus('Impossible de lire cette musique (Id manquant).', true);
					return;
				}

				window.parent.postMessage({ source: 'liste', type: 'LIST_PLAY_SONG', song: row }, '*');
				setStatus(`Lecture envoyée au lecteur: ${row.Titre || id}`);
			}

			function renderLikedMusics(rows) {
				likedBody.innerHTML = '';

				if (!rows.length) {
					likedBody.innerHTML = '<tr><td colspan="5">Aucune musique aimée pour le moment.</td></tr>';
					return;
				}

				rows.forEach((row) => {
					const tr = document.createElement('tr');
					tr.innerHTML = `
						<td>${escapeHtml(row.Titre || '')}</td>
						<td>${escapeHtml(row.Artiste || '')}</td>
						<td>${escapeHtml(row.Album || '')}</td>
						<td>${Number(row.NombreVue || 0)}</td>
						<td><button type="button" class="play-btn" aria-label="Lire">▶</button></td>
					`;

					tr.addEventListener('click', (event) => {
						const target = event.target;
						if (target instanceof HTMLElement && target.closest('button')) {
							return;
						}
						playMusic(row);
					});

					const playButton = tr.querySelector('.play-btn');
					playButton.addEventListener('click', () => playMusic(row));

					likedBody.appendChild(tr);
				});
			}

			async function loadLikedMusics() {
				try {
					const payload = await sendMessageAndWait(window.parent, { action: 'likedMusics' });
					if (!payload || payload.success === false) {
						throw new Error((payload && payload.error) || 'Impossible de récupérer les musiques aimées');
					}

					const musiques = Array.isArray(payload.musiques) ? payload.musiques : [];
					renderLikedMusics(musiques);

					if (!musiques.length) {
						setStatus('Aucune musique aimée pour le moment.');
					} else {
						setStatus(`${musiques.length} musique(s) aimée(s).`);
					}
				} catch (error) {
					console.error(error);
					setStatus(error.message || 'Erreur de chargement.', true);
				}
			}

			void loadLikedMusics();

			window.addEventListener('message', (event) => {
				const data = event && event.data ? event.data : {};
				if (data.target === 'favoris' && data.type === 'REFRESH_FAVORITES') {
					void loadLikedMusics();
				}
			});
		</script>
	</body>
</html>
