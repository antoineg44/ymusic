<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Mes favoris - YMusic</title>
		<link rel="stylesheet" href="../../components/colors/colors.css" />
		<link rel="stylesheet" href="../../components/listMusic/listMusic.css" />
    	<script src="../../js/config.js"></script>
		<style>
			.liked-page {
				max-width: 1100px;
				margin: 0 auto;
				padding: 24px;
			}

			.liked-head {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
				margin-bottom: 16px;
			}

			.liked-head h1 {
				margin: 0;
			}

			.status {
				margin: 6px 0 0;
				min-height: 1.2em;
				color: #7dd3fc;
			}

			.home-results {
				list-style: none;
				margin: 12px 0 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.home-results li {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 10px;
				background: rgba(30, 41, 59, 0.7);
				border: 1px solid rgba(148, 163, 184, 0.15);
				border-radius: 12px;
				padding: 10px 12px;
				cursor: pointer;
			}

			.home-results .queue-item-index {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 32px;
				min-width: 32px;
				height: 32px;
				background: rgba(56, 189, 248, 0.2);
				border-radius: 50%;
				color: #38bdf8;
				font-weight: 700;
				font-size: 0.9rem;
			}

			.home-results .track-info {
				display: flex;
				flex-direction: column;
				flex: 1;
				min-width: 0;
			}

			.home-results .track-info strong,
			.home-results .track-info small {
				display: block;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.home-results .track-info small {
				color: #94a3b8;
			}

			.home-results .actions {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 8px;
				min-width: 40px;
			}

			.home-results .actions button {
				width: 28px;
				height: 28px;
				border-radius: 50%;
				border: 0;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main class="liked-page">
			<section class="panel">
				<div class="liked-head">
					<div>
						<h1>Mes musiques aimées</h1>
						<p id="likedStatus" class="status">Chargement...</p>
					</div>
				</div>

				<ul id="likedResults" class="home-results" aria-label="Liste des musiques aimées"></ul>
			</section>
		</main>

		<script src="../../components/listMusic/listMusic.js"></script>
		<script>
			const likedResults = document.getElementById('likedResults');
			const likedStatus = document.getElementById('likedStatus');

			function setStatus(message, isError = false) {
				likedStatus.textContent = message;
				likedStatus.style.color = isError ? '#fca5a5' : '#7dd3fc';
			}

			function toDisplayDuration(rawDuration) {
				if (typeof rawDuration === 'number' && Number.isFinite(rawDuration)) {
					const safeSeconds = Math.max(0, Math.floor(rawDuration));
					const minutes = Math.floor(safeSeconds / 60);
					const seconds = safeSeconds % 60;
					return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
				}

				const asText = String(rawDuration || '').trim();
				return asText || '00:00';
			}

			function normalizeMusicRow(row) {
				const id = String((row && row.Id) || '').trim();
				const title = String((row && row.Titre) || '').trim();
				const artist = String((row && row.Artiste) || '').trim();

				return {
					Id: id,
					title,
					artists: artist ? [artist] : [],
					duration: toDisplayDuration(row && row.Duree),
					views: Number(row && row.NombreVue) || 0,
					showIndex: true,
					buttons: {
						source: 'liste',
						buttons: {
							play: {
								type: 'LIST_PLAY_SONG',
								payload: {
									song: {
										Id: id,
										Titre: title,
										Artiste: artist,
									},
								},
							},
						},
					},
				};
			}

			function renderLikedMusics(rows) {
				likedResults.innerHTML = '';

				rows.forEach((row, index) => {
					const preparedSong = normalizeMusicRow(row);
					const item = renderElement(preparedSong, index);
					likedResults.appendChild(item);
				});
			}

			async function loadLikedMusics() {
				try {
					const payload = await sendMessageAndWait(window.parent, { action: 'likedMusics' });
					if (!payload || payload.success === false) {
						throw new Error((payload && payload.error) || 'Impossible de récupérer les musiques aimées');
					}

					const musiques = Array.isArray(payload.musiques) ? payload.musiques : [];
					renderLikedMusics(musiques);

					if (!musiques.length) {
						setStatus('Aucune musique aimée pour le moment.');
					} else {
						setStatus(`${musiques.length} musique(s) aimée(s).`);
					}
				} catch (error) {
					console.error(error);
					setStatus(error.message || 'Erreur de chargement.', true);
				}
			}

			void loadLikedMusics();

			window.addEventListener('message', (event) => {
				const data = event && event.data ? event.data : {};
				if (data.target === 'favoris' && data.type === 'REFRESH_FAVORITES') {
					void loadLikedMusics();
				}
			});
		</script>
	</body>
</html>
