<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Liste des playlists - YMusic</title>
		<link rel="stylesheet" href="../../components/colors/colors.css" />
    	<link rel="stylesheet" href="../../components/listMusic/listMusic.css" />
    	<script src="../../js/config.js"></script>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: var(--background);
				color-scheme: dark;
				font-family: Inter, Arial, sans-serif;
				color: #e2e8f0;
			}

			.playlists-page {
				max-width: 1300px;
				margin: 0 auto;
			}

			.playlists-head {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
				margin-bottom: 16px;
			}

			.content-grid {
				display: grid;
				grid-template-columns: 360px 1fr;
				gap: 16px;
			}

			.card {
				background: rgba(30, 41, 59, 0.7);
				border: 1px solid rgba(148, 163, 184, 0.15);
				border-radius: 12px;
				padding: 12px;
			}


			.playlists-table {
				width: 100%;
				border-collapse: collapse;
			}

			.playlists-table th,
			.playlists-table td {
				text-align: left;
				border-bottom: 1px solid rgba(148, 163, 184, 0.2);
				padding: 10px;
				vertical-align: top;
			}

			.playlists-table th {
				color: #94a3b8;
				font-weight: 600;
			}

			.playlist-row.is-active {
				background: rgba(56, 189, 248, 0.1);
			}

			.playlist-user-link {
				color: #7dd3fc;
				text-decoration: none;
			}

			.playlist-user-link:hover {
				text-decoration: underline;
			}

			.playlist-row {
				cursor: pointer;
			}

			.musiques-table {
				width: 100%;
				border-collapse: collapse;
			}

			.musiques-table th,
			.musiques-table td {
				text-align: left;
				border-bottom: 1px solid rgba(148, 163, 184, 0.2);
				padding: 10px;
				white-space: nowrap;
			}

			.play-btn {
				border: 0;
				border-radius: 999px;
				padding: 6px 10px;
				cursor: pointer;
				background: #38bdf8;
				color: #082f49;
				font-weight: 700;
			}

			.like-btn {
				border: 0;
				background: transparent;
				cursor: pointer;
				font-size: 1.25rem;
				line-height: 1;
				padding: 4px 6px;
				color: #94a3b8;
			}

			.like-btn.is-liked {
				color: #ec4899;
			}

			.like-cell {
				text-align: center;
			}

			.status {
				margin: 0;
				color: #7dd3fc;
			}

			.hidden {
				display: none;
			}

			.songs-head {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 10px;
			}

			.back-btn {
				border: 0;
				border-radius: 999px;
				padding: 6px 10px;
				cursor: pointer;
				background: rgba(56, 189, 248, 0.2);
				color: #7dd3fc;
				font-weight: 700;
			}

			.duplicate-btn {
				border: 0;
				border-radius: 999px;
				padding: 6px 10px;
				cursor: pointer;
				background: #22c55e;
				color: #052e16;
				font-weight: 700;
			}

			.play-all-btn {
				border: 0;
				border-radius: 999px;
				padding: 6px 10px;
				cursor: pointer;
				background: #38bdf8;
				color: #082f49;
				font-weight: 700;
			}

			.sort-control {
				display: flex;
				align-items: center;
				gap: 10px;
				margin: 0 0 12px;
				flex-wrap: wrap;
			}

			.sort-label {
				color: #cbd5e1;
				font-weight: 600;
			}

			.sort-select {
				appearance: none;
				border: 1px solid rgba(148, 163, 184, 0.25);
				border-radius: 999px;
				background: rgba(15, 23, 42, 0.7);
				color: #e2e8f0;
				padding: 8px 34px 8px 12px;
				font-weight: 600;
				cursor: pointer;
				background-image: linear-gradient(45deg, transparent 50%, #7dd3fc 50%), linear-gradient(135deg, #7dd3fc 50%, transparent 50%);
				background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
				background-size: 6px 6px, 6px 6px;
				background-repeat: no-repeat;
			}

			.playlist-tracks {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.playlist-tracks li {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 10px;
				background: rgba(30, 41, 59, 0.7);
				border: 1px solid rgba(148, 163, 184, 0.15);
				border-radius: 12px;
				padding: 10px 12px;
			}

			.track-info {
				display: flex;
				flex-direction: column;
				overflow: hidden;
				flex: 1;
			}

			.track-info strong {
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.track-info small {
				color: #94a3b8;
			}

			.actions {
				display: flex;
				gap: 8px;
			}

			@media (max-width: 980px) {
				.content-grid {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<main class="playlists-page">
			<section class="playlists-head">
				<div>
					<p id="playlistsStatus" class="status">Chargement des playlists...</p>
				</div>
			</section>

			<section class="content-grid">
				<article id="playlistsCard" class="card" aria-label="Liste des playlists">
					<h2>Playlists</h2>
					<div class="musiques-table-wrap">
						<table class="playlists-table" aria-label="Playlists de la communauté">
							<thead>
								<tr>
									<th>ID</th>
									<th>Nom</th>
									<th>Description</th>
									<th>Date derniere modification</th>
									<th>Vues</th>
									<th>Aimer</th>
								</tr>
							</thead>
							<tbody id="playlistsBody"></tbody>
						</table>
					</div>
				</article>

				<article id="songsCard" class="card hidden" aria-label="Musiques de la playlist">
					<div class="songs-head">
						<button id="backToPlaylistsButton" class="back-btn" type="button">← Retour</button>
						<button id="playAllButton" class="play-all-btn" type="button">Lire tout</button>
						<button id="duplicatePlaylistButton" class="duplicate-btn" type="button">Dupliquer</button>
						<h2 id="songsTitle">Musiques</h2>
					</div>
					<div class="sort-control">
						<span class="sort-label">Trier par</span>
						<select id="sortFieldSelect" class="sort-select" aria-label="Trier les musiques par champ">
							<option value="PositionLecture">Position de lecture</option>
							<option value="Titre">Titre</option>
							<option value="Artiste">Artiste</option>
							<option value="Duree">Durée</option>
							<option value="NombreVue">Nombre de vues</option>
							<option value="DateAjout">Date d'ajout</option>
						</select>
					</div>
					<ul id="songsList" class="playlist-tracks" aria-label="Musiques de playlist"></ul>
				</article>
			</section>
		</main>

		<script src="../../components/listMusic/listMusic.js"></script>
		<script>
			const playlistsStatus = document.getElementById('playlistsStatus');
			const playlistsBody = document.getElementById('playlistsBody');
			const songsList = document.getElementById('songsList');
			const songsTitle = document.getElementById('songsTitle');
			const playlistsCard = document.getElementById('playlistsCard');
			const songsCard = document.getElementById('songsCard');
			const backToPlaylistsButton = document.getElementById('backToPlaylistsButton');
			const playAllButton = document.getElementById('playAllButton');
			const duplicatePlaylistButton = document.getElementById('duplicatePlaylistButton');
			const sortFieldSelect = document.getElementById('sortFieldSelect');

			let activePlaylistId = '';
			let openedPlaylistName = '';
			let openedPlaylistDescription = '';
			let openedPlaylistSongs = [];
			let currentSortField = 'PositionLecture';
			let currentSortDirection = 'ASC';
			let currentUserId = 0;
			let likedPlaylistIds = new Set();

			function postToParent(type, payload = {}) {
				window.parent.postMessage({ source: 'liste', type, ...payload }, '*');
			}

			function escapeHtml(value) {
				return String(value ?? '')
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/\"/g, '&quot;');
			}

			function setStatus(message, isError = false) {
				playlistsStatus.textContent = message;
				playlistsStatus.style.color = isError ? '#fca5a5' : '#7dd3fc';
			}

			function showPlaylistsView() {
				playlistsCard.classList.remove('hidden');
				songsCard.classList.add('hidden');
				songsTitle.textContent = 'Musiques';
				songsList.innerHTML = '';
				openedPlaylistSongs = [];
			}

			function showSongsView() {
				playlistsCard.classList.add('hidden');
				songsCard.classList.remove('hidden');
			}

			function formatMeta(playlist) {
				const total = Number(playlist.TotalMusiques || 0);
				return `${total} musique(s)`;
			}

			function formatDate(value) {
				if (!value) {
					return '-';
				}

				return String(value).replace('T', ' ');
			}

			function renderUserLink(playlist) {
				const userId = Number(playlist.Utilisateur || 0);
				const userName = String(playlist.UtilisateurNom || '').trim();

				if (!userId) {
					return escapeHtml(userName || '-');
				}

				const label = userName ? `${escapeHtml(userName)} (${userId})` : String(userId);
				return `<a class="playlist-user-link" href="../../popup/users/users.html#user-${userId}">${label}</a>`;
			}

			function renderPlaylists(playlists) {
				playlistsBody.innerHTML = '';

				if (!playlists.length) {
					playlistsBody.innerHTML = '<tr><td colspan="6">Aucune playlist en base.</td></tr>';
					return;
				}

				playlists.forEach((playlist) => {
					const id = Number(playlist.PlaylistId || 0);
					const tr = document.createElement('tr');
					tr.className = `playlist-row ${activePlaylistId === id ? 'is-active' : ''}`;
					tr.dataset.id = String(id);
					tr.innerHTML = `
						<td>${id || '-'}</td>
						<td>${escapeHtml(playlist.NomPlaylist || 'Playlist')}</td>
						<td>${escapeHtml(playlist.Description || '')}</td>
						<td>${escapeHtml(formatDate(playlist.DateDerniereModification))}</td>
						<td>${Number(playlist.NombreVue || 0)}</td>
						<td class="like-cell"></td>
					`;

					const likeCell = tr.querySelector('.like-cell');
					const ownerId = Number(playlist.Utilisateur || 0);
					if (likeCell && id && (!currentUserId || ownerId !== currentUserId)) {
						const likeButton = document.createElement('button');
						likeButton.type = 'button';
						likeButton.className = 'like-btn';
						updateLikeButton(likeButton, id);
						likeButton.addEventListener('click', (event) => {
							event.stopPropagation();
							void toggleLikePlaylist(id, likeButton);
						});
						likeCell.appendChild(likeButton);
					}

					tr.addEventListener('click', (event) => {
						const target = event.target;
						if (target instanceof HTMLElement && target.closest('a, button')) {
							return;
						}

						activePlaylistId = id;
						openedPlaylistName = String(playlist.NomPlaylist || String(id));
						openedPlaylistDescription = String(playlist.Description || '');
						showSongsView();
						void loadPlaylistSongs(String(id), playlist.NomPlaylist || String(id));
						const allRows = playlistsBody.querySelectorAll('.playlist-row');
						allRows.forEach((el) => el.classList.remove('is-active'));
						tr.classList.add('is-active');
					});

					playlistsBody.appendChild(tr);
				});
			}

			function updateLikeButton(button, playlistId) {
				const liked = likedPlaylistIds.has(Number(playlistId));
				button.classList.toggle('is-liked', liked);
				button.textContent = liked ? '♥' : '♡';
				button.title = liked ? 'Retirer des playlists aimées' : 'Aimer cette playlist';
				button.setAttribute('aria-label', button.title);
			}

			async function toggleLikePlaylist(playlistId, button) {
				const id = Number(playlistId) || 0;
				if (!id) {
					return;
				}

				const wasLiked = likedPlaylistIds.has(id);
				const action = wasLiked ? 'removeLikedPlaylist' : 'addLikedPlaylist';

				if (wasLiked) {
					likedPlaylistIds.delete(id);
				} else {
					likedPlaylistIds.add(id);
				}
				updateLikeButton(button, id);

				try {
					const payload = await sendMessageAndWait(window.parent, {
						action,
						body: { IdPlaylist: String(id) },
					});
					if (!payload || payload.success === false) {
						throw new Error((payload && payload.error) || 'Action impossible.');
					}
					setStatus(wasLiked ? 'Playlist retiree de vos favoris.' : 'Playlist ajoutee a vos favoris.');
				} catch (error) {
					if (wasLiked) {
						likedPlaylistIds.add(id);
					} else {
						likedPlaylistIds.delete(id);
					}
					updateLikeButton(button, id);
					console.error(error);
					setStatus(error.message || 'Impossible de mettre a jour le favori.', true);
				}
			}

			function renderSongs(rows) {
				songsList.innerHTML = '';

				if (!rows.length) {
					songsList.innerHTML = '<li>Aucune musique liee a cette playlist.</li>';
					return;
				}

				rows.forEach((row, index) => {
					const preparedSong = {
						title: String(row.Titre || 'Musique inconnue'),
						artists: row.Artiste ? [String(row.Artiste)] : [],
						duration: Number(row.Duree || 0),
						views: Number(row.NombreVue || 0),
						showIndex: false,
						buttons: {
							buttons: {
								play: {
									type: 'LIST_PLAY_SONG',
									result: row,
									className: 'play-btn',
								},
							},
							source: 'liste',
						},
					};

					const item = renderElement(preparedSong, index);
					songsList.appendChild(item);
				});
			}

			async function loadPlaylistSongs(playlistId, playlistName, sortField = currentSortField, sortDirection = currentSortDirection) {
				try {
					songsTitle.textContent = `Musiques - ${playlistName}`;
					const validSortField = ['PositionLecture', 'Titre', 'Artiste', 'Duree', 'NombreVue', 'DateAjout'].includes(sortField)
						? sortField
						: 'PositionLecture';
					const validSortDirection = String(sortDirection || 'ASC').toUpperCase() === 'DESC' ? 'DESC' : 'ASC';
					currentSortField = validSortField;
					currentSortDirection = validSortDirection;
					if (sortFieldSelect) {
						sortFieldSelect.value = validSortField;
					}

					const query = {
						table: 'MyPlaylistMusiques',
						select: ['Id', 'Titre', 'Artiste', 'MusicUtilisateur', 'Album', 'Duree', 'AnneeParution', 'Genre', 'NombreVue', 'NombreVueInterne', 'DateAjout', 'PositionLecture',],
						withMusicDetails: true,
						equals: {
							IdPlaylist: String(playlistId || ''),
						},
						orderBy: validSortField,
						order: validSortDirection,
						limit: 2000,
						page: 1
					};

					const payload = await sendMessageAndWait(window.parent, {
						action: 'playlistSongs',
						query,
					});
					if (!payload || payload.success === false) {
						throw new Error(payload.error || 'Impossible de recuperer les musiques de la playlist.');
					}

					const rows = Array.isArray(payload.myPlaylistMusiques)
						? payload.myPlaylistMusiques
						: (Array.isArray(payload.songs) ? payload.songs : []);
					openedPlaylistSongs = rows;
					renderSongs(rows);
					setStatus(`Playlist "${playlistName}" chargee (${rows.length} musique(s)) - tri: ${validSortField}.`);
				} catch (error) {
					console.error(error);
					openedPlaylistSongs = [];
					setStatus(error.message || 'Erreur de chargement des musiques.', true);
				}
			}

			async function createPlaylistInDatabase(name, description) {
				const safeName = String(name || '').trim();
				if (!safeName) {
					throw new Error('Nom de playlist requis.');
				}

				const body = new URLSearchParams({
					createPlaylist: '1',
					NomPlaylist: safeName,
					Description: String(description || ''),
				});

				const payload = await sendMessageAndWait(window.parent, {
					action: 'createPlaylist',
					body: Object.fromEntries(body.entries()),
				});

				if (!payload || !payload.success) {
					throw new Error(payload.error || 'Impossible de creer la playlist.');
				}

				return Number(payload.playlist && payload.playlist.PlaylistId ? payload.playlist.PlaylistId : 0);
			}

			async function addMusicToPlaylist(playlistId, musicId) {
				const payload = await sendMessageAndWait(window.parent, {
					action: 'addPlaylistMusic',
					body: {
						IdPlaylist: String(playlistId),
						IdMusique: String(musicId),
					},
				});

				if (!payload || !payload.success) {
					throw new Error(payload.error || 'Impossible d\'ajouter une musique a la playlist.');
				}
			}

			async function duplicateOpenedPlaylist() {
				if (!activePlaylistId || !openedPlaylistName) {
					setStatus('Aucune playlist ouverte a dupliquer.', true);
					return;
				}

				const defaultName = `${openedPlaylistName} (copie)`;
				const newName = String(window.prompt('Nom de la playlist dupliquee:', defaultName) || '').trim();
				if (!newName) {
					return;
				}

				try {
					setStatus('Duplication de la playlist en cours...');
					const songIds = openedPlaylistSongs
						.map((song) => String((song && song.Id) || '').trim())
						.filter(Boolean);

					const newPlaylistId = await createPlaylistInDatabase(newName, openedPlaylistDescription);
					if (!newPlaylistId) {
						return;
					}

					let copiedCount = 0;
					for (const songId of songIds) {
						await addMusicToPlaylist(newPlaylistId, songId);
						copiedCount += 1;
					}

					setStatus(`Playlist dupliquee: ${newName} (${copiedCount} musique(s) copiee(s)).`);
				} catch (error) {
					console.error(error);
					setStatus(error.message || 'Impossible de dupliquer la playlist.', true);
				}
			}

			function buildPlaylistQueueTracks(rows) {
				return rows
					.map((row) => {
						const videoId = String((row && row.Id) || '').trim();
						if (!videoId) {
							return null;
						}

						const artist = String((row && row.Artiste) || '').trim();
						return {
							videoId,
							title: String((row && row.Titre) || 'Musique inconnue').trim(),
							artists: artist ? [artist] : [],
							duration: Number((row && row.Duree) || 0),
							views: Number((row && row.NombreVue) || 0),
						};
					})
					.filter(Boolean);
			}

			async function incrementPlaylistView(playlistId) {
				try {
					const payload = await sendMessageAndWait(window.parent, {
						action: 'incrementPlaylistView',
						body: {
							playlistId: String(playlistId),
						},
					});

					if (!payload || !payload.success) {
						console.debug('incrementPlaylistView failed:', payload && payload.error);
					}
				} catch (error) {
					console.debug('incrementPlaylistView error:', error);
				}
			}

			async function playAllOpenedPlaylist() {
				if (!activePlaylistId || !openedPlaylistName) {
					setStatus('Aucune playlist ouverte a lire.', true);
					return;
				}

				const tracks = buildPlaylistQueueTracks(openedPlaylistSongs);
				if (!tracks.length) {
					setStatus('Aucune musique disponible dans cette playlist.', true);
					return;
				}

				try {
					await incrementPlaylistView(activePlaylistId);

					window.parent.postMessage(
						{
							source: 'playlists',
							type: 'PLAYLIST_LOAD_ALL',
							tracks,
						},
						'*'
					);

					setStatus(`File de lecture remplacee par "${openedPlaylistName}" (${tracks.length} musique(s)).`);
				} catch (error) {
					console.error(error);
					setStatus(error.message || 'Impossible de lire la playlist.', true);
				}
			}

			async function loadCurrentUserId() {
				try {
					const payload = await sendMessageAndWait(window.parent, { action: 'currentUser' });
					if (payload && payload.success !== false) {
						currentUserId = Number(payload.id || 0);
					}
				} catch (error) {
					console.debug('currentUser error:', error);
				}
			}

			async function loadLikedPlaylistIds() {
				try {
					const payload = await sendMessageAndWait(window.parent, { action: 'likedPlaylists' });
					if (payload && payload.success !== false && Array.isArray(payload.playlistIds)) {
						likedPlaylistIds = new Set(payload.playlistIds.map((value) => Number(value)));
					}
				} catch (error) {
					console.debug('likedPlaylists error:', error);
				}
			}

			async function loadPlaylists() {
				try {
					await Promise.all([loadCurrentUserId(), loadLikedPlaylistIds()]);

					const query = {
						table: 'Playlist',
						select: ['idPlaylist', 'NomPlaylist', 'Description', 'DateDerniereModification', 'Partage', 'NombreVue', 'Utilisateur'],
						orderBy: 'DateDerniereModification',
						order: 'DESC',
						limit: 500,
						page: 1,
					};

					const payload = await sendMessageAndWait(window.parent, { action: 'dbPlaylists', query });
					if (!payload || payload.success === false) {
						throw new Error(payload.error || 'Impossible de recuperer la liste des playlists.');
					}

					const rawPlaylists = Array.isArray(payload.playlists) ? payload.playlists : [];
					const playlists = rawPlaylists.map((row) => ({
						PlaylistId: Number((row && (row.PlaylistId ?? row.idPlaylist)) || 0),
						NomPlaylist: String((row && row.NomPlaylist) || ''),
						Description: String((row && row.Description) || ''),
						DateDerniereModification: String((row && row.DateDerniereModification) || ''),
						Partage: Number((row && row.Partage) || 0),
						NombreVue: Number((row && row.NombreVue) || 0),
						Utilisateur: Number((row && row.Utilisateur) || 0),
					}));
					const sharedPlaylists = playlists.filter((playlist) => Number((playlist && playlist.Partage) || 0) === 1);
					renderPlaylists(sharedPlaylists);
					showPlaylistsView();
					setStatus(`${sharedPlaylists.length} playlist(s) partagee(s) chargee(s).`);
				} catch (error) {
					console.error(error);
					setStatus(error.message || 'Erreur de chargement.', true);
				}
			}

			function initEvent() {
				window.addEventListener('message', (event) => {
					const message = event.data;
					if (!message || message.target !== 'listePlaylists') {
						return;
					}

					if (message.type === 'REFRESH_LISTE_PLAYLISTS') {
						void loadPlaylists();
					}
				});
			}

			function init() {
				playAllButton.addEventListener('click', () => {
					playAllOpenedPlaylist();
				});
				duplicatePlaylistButton.addEventListener('click', () => {
					void duplicateOpenedPlaylist();
				});
				backToPlaylistsButton.addEventListener('click', () => {
					showPlaylistsView();
				});
				if (sortFieldSelect) {
					sortFieldSelect.addEventListener('change', (event) => {
						const field = String(event.target.value || 'PositionLecture');
						if (!activePlaylistId || !openedPlaylistName) {
							currentSortField = field;
							return;
						}
						void loadPlaylistSongs(activePlaylistId, openedPlaylistName, field, currentSortDirection);
					});
				}
				showPlaylistsView();
				void loadPlaylists();
				initEvent();
			}

			init();
		</script>
	</body>
</html>
